---
# Authelia users and access rules, see base/docs/contract.md. The passwords are not here: `task authelia:user -- <name>`
# asks for one and stores its hash sops-encrypted (authelia.sops.yml); the TOTP seed is generated alongside.
authelia_users:
  admin:
    displayname: Admin
    email: admin@example.org
    groups: [admin]

# Rules of the PUBLIC authelia (cluster_domain): only for public apps that need a login. The ops UIs (nomad, consul, traefik, auth.) are not here any more:
# they live in the internal zone behind the VPN, with their own authelia and their own rules (authelia_internal_extra_rules for more internal apps).
# Every rule is two_factor (site.yml refuses anything else), or `bypass` for a public app; a domain without a rule is denied. Example:
#   - domain: "app.{{ cluster_domain }}"
#     policy: two_factor
#     subject: ["group:admin"]
authelia_access_rules: []
