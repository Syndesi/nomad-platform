---
# Authelia users and access rules, see base/docs/contract.md. The passwords are not here: `task authelia:user -- <name>`
# asks for one and stores its hash sops-encrypted (authelia.sops.yml); the TOTP seed is generated alongside.
authelia_users:
  admin:
    displayname: Admin
    email: admin@example.org
    groups: [admin]

authelia_access_rules:
  # Traefik sends every request through authelia; a domain without a rule is denied. Rules are two_factor, deny, or `bypass` for a
  # public job (first match wins, so put bypass rules after these).
  - domain: "nomad.{{ cluster_domain }}"
    policy: two_factor
    subject: ["group:admin"]
  - domain: "consul.{{ cluster_domain }}"
    policy: two_factor
    subject: ["group:admin"]
  - domain: "traefik.{{ cluster_domain }}"
    policy: two_factor
    subject: ["group:admin"]
