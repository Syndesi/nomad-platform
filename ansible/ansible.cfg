[defaults]
# /work is the cluster repo, /work/base the pinned nomad-platform. Inventory sources are merged in order: the base
# one only carries the defaults (group_vars), the cluster's inventory (hosts, cluster.yml, secrets) wins.
inventory = /work/base/ansible/inventory,/work/inventory
roles_path = /work/base/ansible/roles:/work/roles:/opt/ansible/roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
# per-task timing and the slowest tasks at the end of every run (see PROFILE_TASKS_* in compose.yml)
callbacks_enabled = ansible.posix.profile_tasks
# *.sops.yml next to the other group vars are decrypted on the fly (age identity: SOPS_AGE_KEY_FILE)
vars_plugins_enabled = ansible.builtin.host_group_vars, community.sops.sops

[connection]
# With pipelining the module goes in over stdin instead of upload + chmod + run + delete: about a third less time per task.
pipelining = True

[ssh_connection]
# keep one connection per node open: a deploy runs hundreds of tasks
ssh_args = -o ControlMaster=auto -o ControlPersist=120s
