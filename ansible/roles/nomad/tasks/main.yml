---
# Nomad agent: server and/or client depending on the inventory groups. Fragments 30-server /
# 40-client are only present on nodes with that role.
- name: Nomad binary and service definition
  ansible.builtin.include_role:
    name: hashi_agent
  vars:
    hashi_agent_name: nomad
    hashi_agent_version: "{{ nomad_version }}"
    hashi_agent_args: "agent -config {{ nomad_config_dir }}"
    hashi_agent_description: Nomad agent
    # Client tasks must survive an agent restart/upgrade, so only kill the main process.
    hashi_agent_openrc_ulimit: "-n 1048576 -u unlimited"
    hashi_agent_systemd_service_extra:
      - KillMode=process
      - KillSignal=SIGINT
      - LimitNOFILE=infinity
      - LimitNPROC=infinity
      - TasksMax=infinity
      # a subset: nomad stays root and drives docker, cni, cgroups and mounts, so no filesystem or capability restrictions (systemd only).
      # NOT ProtectKernelModules / ProtectKernelLogs / ProtectClock (nor any other Protect*): they put the service in a private mount namespace, and
      # the tmpfs that nomad mounts for the secrets of every task is then invisible to dockerd: the secrets directory of every container (templates
      # in secrets/, the Envoy bootstrap of Connect sidecars) would be empty.
      - NoNewPrivileges=true
      - RestrictRealtime=true
      - LockPersonality=true
      - SystemCallArchitectures=native

# `external` volumes (the docker socket, tetragon's log directory) are made by someone else and keep their owner and mode
- name: Data and host volume directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
  loop: "{{ [{'path': nomad_data_dir}] + (nomad_host_volumes | rejectattr('external', 'defined') | list) }}"
  loop_control:
    label: "{{ item.path }}"

# traefik's data (acme.json: a private key) belongs to the user traefik runs as (cluster_traefik_uid); recursive, so an acme.json made by an
# earlier root-run traefik is handed over too
- name: Traefik data directory
  ansible.builtin.file:
    path: "{{ nomad_host_volumes_dir }}/traefik"
    state: directory
    owner: "{{ cluster_traefik_uid }}"
    group: "{{ cluster_traefik_uid }}"
    mode: "0755"
  when: inventory_hostname in groups['cluster_ingress'] | default([])

# ownership only (acme.json keeps its own mode, traefik insists on 0600)
- name: Traefik data files belong to that user too
  ansible.builtin.shell: |
    find {{ (nomad_host_volumes_dir ~ '/traefik') | quote }} -not -user {{ cluster_traefik_uid | int }} -exec chown {{ cluster_traefik_uid | int }}:{{ cluster_traefik_uid | int }} {} + -print
  register: nomad_traefik_chown
  changed_when: nomad_traefik_chown.stdout | length > 0
  when: inventory_hostname in groups['cluster_ingress'] | default([])

# step-ca's database folder belongs to the user of the image
- name: Step-ca data directory
  ansible.builtin.file:
    path: "{{ cluster_stepca_dir }}"
    state: directory
    owner: "{{ cluster_stepca_uid | int }}"
    group: "{{ cluster_stepca_uid | int }}"
    mode: "0700"
  when: nomad_stepca_enabled | bool

# Older versions let every process of the ingress node bind ports from 80 (traefik ran in the host network). It runs in its own namespace now, which gets
# the setting from the job (task vpn), so the host is back to the default: the file goes (a node that has it keeps the value until its next reboot).
- name: The host does not allow unprivileged binds from port 80 any more
  ansible.builtin.file:
    path: /etc/sysctl.d/90-cluster-ingress.conf
    state: absent

# Authelia's state: a folder each for the two instances (only the user authelia runs as, cluster_authelia_uid), before the agent that offers
# them as volumes
- name: Authelia state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ cluster_authelia_uid | int }}"
    group: "{{ cluster_authelia_uid | int }}"
  loop: ["{{ cluster_authelia_dir }}", "{{ cluster_authelia_internal_dir }}"]
  when: nomad_authelia_enabled | bool

# the data of Postgres (job authelia-db): the user of the postgres image owns it, nobody else reads it
- name: Authelia database directory
  ansible.builtin.file:
    path: "{{ cluster_authelia_db_dir }}"
    state: directory
    mode: "0700"
    owner: "{{ cluster_authelia_postgres_uid | int }}"
    group: "{{ cluster_authelia_postgres_uid | int }}"
  when: nomad_authelia_enabled | bool

# a database made by an earlier root-run authelia (or a restore) is handed over too
- name: Authelia state files belong to that user too
  ansible.builtin.shell: |
    find {{ item | quote }} -not -user {{ cluster_authelia_uid | int }} -exec chown {{ cluster_authelia_uid | int }}:{{ cluster_authelia_uid | int }} {} + -print
  register: nomad_authelia_chown
  changed_when: nomad_authelia_chown.stdout | length > 0
  loop: ["{{ cluster_authelia_dir }}", "{{ cluster_authelia_internal_dir }}"]
  when: nomad_authelia_enabled | bool

# One file per concern. 30-server / 40-client only exist on nodes with that role. Other roles /
# inventory groups add their own fragments next to these (e.g. gpu devices on a dedicated node,
# volumes that are generated externally) without touching them.
- name: Nomad config fragments
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nomad_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  loop: >-
    {{ ['00-base.hcl', '10-tls.hcl', '20-acl.hcl', '50-consul.hcl']
       + (['30-server.hcl'] if nomad_is_server else [])
       + (['40-client.hcl'] if nomad_is_client else [])
       + (['55-authelia.hcl'] if nomad_authelia_enabled | bool else []) }}
  register: nomad_fragments

- name: No authelia volume fragment on nodes that may not run authelia
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}/55-authelia.hcl"
    state: absent
  when: not nomad_authelia_enabled | bool
  register: nomad_authelia_fragment_removed

- name: Cluster-specific fragments (host volumes, devices, ...)
  ansible.builtin.include_role:
    name: hashi_agent
    tasks_from: extras
  vars:
    hashi_agent_name: nomad
    hashi_agent_config_dir: "{{ nomad_config_dir }}"
    hashi_agent_extras_dir: "{{ cluster_nomad_fragments_dir }}"

- name: Remove fragments of a role this node no longer has
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}/{{ item.file }}"
    state: absent
  loop:
    - { file: 30-server.hcl, keep: "{{ nomad_is_server }}" }
    - { file: 40-client.hcl, keep: "{{ nomad_is_client }}" }
  when: not item.keep
  register: nomad_fragments_removed

- name: Start / restart nomad
  ansible.builtin.include_role:
    name: hashi_agent
    tasks_from: apply
  vars:
    hashi_agent_name: nomad
    hashi_agent_validate: "nomad config validate {{ nomad_config_dir }}"
    hashi_agent_config_changed: "{{ nomad_fragments.changed or (nomad_fragments_removed.changed | default(false)) or (nomad_authelia_fragment_removed.changed | default(false)) or hashi_agent_extras_changed }}"

- name: Nomad api answers
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ cluster_nomad_http_port }}/v1/agent/self"
    ca_path: "{{ cluster_tls_dir }}/ca.pem"
    status_code: [200, 403] # 403 = up, acl denies the anonymous request
  register: nomad_up
  until: nomad_up.status | default(0) in [200, 403]
  retries: 90
  delay: 1
  changed_when: false
