---
# Observe: every tcp connection that a process in a container opens (event process_kprobe, function tcp_connect: source and destination address).
# Processes of the host itself are left out (namespace filter). Not an enforcement, nothing is killed.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: cluster-network-connect
spec:
  kprobes:
    - call: tcp_connect
      syscall: false
      args:
        - index: 0
          type: sock
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
