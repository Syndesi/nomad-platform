---
# Both authelia instances: the public one (cluster_domain) and authelia-internal (the zone behind the VPN, separate seeds).
- name: Second factors of the users of one instance
  ansible.builtin.include_tasks: instance.yml
  vars:
    authelia_totp_inst: "{{ inst }}"
    authelia_totp_inst_users: "{{ authelia_users.keys() | list | intersect(inst.totp_seeds.keys() | list) }}"
  loop: >-
    {{ [{'name': 'authelia', 'issuer': authelia_totp_issuer, 'totp_seeds': authelia_totp_seeds | default({}), 'out_prefix': ''},
        {'name': 'authelia-internal', 'issuer': authelia_totp_issuer_internal, 'totp_seeds': authelia_internal_totp_seeds | default({}), 'out_prefix': 'internal-'}] }}
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
