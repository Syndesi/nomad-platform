---
# The bootstrap token is deleted from the cluster once the ops token works (tofu-nomad minted it). Run on the first server, after tasks token.
# Nothing to do when the bootstrap token is gone already (every later deploy). Unlike consul's, it is not in any config file, so nothing
# can create it again; `nomad acl bootstrap` does not run again either (flag file, and nomad refuses a second bootstrap).
- name: The bootstrap token is deleted
  when: hostvars['localhost'].cluster_nomad_bootstrap_alive | bool and hostvars['localhost'].cluster_nomad_token_effective != cluster_nomad_management_token
  block:
    - name: The accessor of the bootstrap token
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ cluster_nomad_http_port }}/v1/acl/token/self"
        ca_path: "{{ cluster_tls_dir }}/ca.pem"
        headers:
          X-Nomad-Token: "{{ cluster_nomad_management_token }}"
        return_content: true
      register: nomad_handover_self
      no_log: true
      changed_when: false

    - name: Delete it (with the ops token)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ cluster_nomad_http_port }}/v1/acl/token/{{ nomad_handover_self.json.AccessorID }}"
        method: DELETE
        ca_path: "{{ cluster_tls_dir }}/ca.pem"
        headers:
          X-Nomad-Token: "{{ hostvars['localhost'].cluster_nomad_token_effective }}"
      no_log: true
      changed_when: true
