---
# Config fragments + (re)start + wait for a leader. Also used on its own (tasks_from: config) to
# add the agent token once it exists.
- name: Consul data directory
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    mode: "0750"

# One file per concern (00-base, 10-tls, 20-acl): other roles / inventory groups add their own
# fragments next to these (e.g. a dedicated node with special capabilities) without touching them.
- name: Consul config fragments
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ consul_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  loop: [00-base.hcl, 10-tls.hcl, 20-acl.hcl]
  register: consul_fragments

- name: Cluster-specific fragments
  ansible.builtin.include_role:
    name: hashi_agent
    tasks_from: extras
  vars:
    hashi_agent_name: consul
    hashi_agent_config_dir: "{{ consul_config_dir }}"
    hashi_agent_extras_dir: "{{ cluster_consul_fragments_dir }}"

- name: Start / restart consul
  ansible.builtin.include_role:
    name: hashi_agent
    tasks_from: apply
  vars:
    hashi_agent_name: consul
    hashi_agent_validate: "consul validate {{ consul_config_dir }}"
    hashi_agent_config_changed: "{{ consul_fragments.changed or hashi_agent_extras_changed }}"

- name: Consul answers (leader elected)
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ cluster_consul_https_port }}/v1/status/leader"
    ca_path: "{{ cluster_tls_dir }}/ca.pem"
    return_content: true
  register: consul_leader
  until: consul_leader.status | default(0) == 200 and (consul_leader.content | trim) not in ['', '""']
  retries: 60
  delay: 1
  changed_when: false
