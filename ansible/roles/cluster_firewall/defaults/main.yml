---
# Host firewall: one nftables table `inet cluster` of its own (docker and nomad keep theirs), loaded at boot by the unit /
# init script `cluster-firewall` on both OS families. The input chain drops by default and accepts:
#   - loopback, established connections, icmp, dhcp replies
#   - ssh (22) from anywhere (no source restriction: a wrong list would lock you out), new connections rate limited per source address
#     (cluster_firewall_ssh_rate; the cluster's own addresses are exempt, so deploys never trip it)
#   - the nomad and consul ports (rpc, serf, http) only from cluster_firewall_cluster_sources
#   - traefik's 80 and 443 on the ingress nodes, from anywhere
#   - from the container bridges (docker0, nomad, br-*) only dns, the nomad and consul api and cluster_firewall_bridge_*_ports; traffic the bridges send to published (nat'ed) ports passes the forward chain
# Containers reach the internet only from the network "egress" (`mode = "cni/egress"`, see group_vars defaults.yml): the forward chain rejects new
# connections from every other bridge to anything outside cluster_firewall_container_destinations.
# Published (nat'ed) job ports pass the forward chain, not input: from outside the cluster and the bridges only the public ports get through,
# any other dnat'ed traffic is dropped (authelia's 9091, the metrics port, ports of your own jobs).
cluster_firewall_file: /etc/cluster/firewall.nft
cluster_firewall_table: cluster

# The cluster's network: by default the subnet of cluster_interface. More entries (a second site over wireguard, ...) are added here.
cluster_firewall_cluster_sources: "{{ cluster_subnets }}"
# New ssh connections per minute from one address; more are dropped (existing sessions are not affected). '' = no limit.
cluster_firewall_ssh_rate: 10/minute
cluster_firewall_ssh_burst: 10
# Raw nft rules appended to the input chain before the final drop (the cluster's own services), e.g. "tcp dport 9100 accept"
cluster_firewall_extra_rules: ""

cluster_firewall_tcp_ports: "{{ [cluster_nomad_http_port, 4647, 4648, 8300, 8301] + cluster_firewall_cluster_only_ports + ([cluster_tetragon_metrics_port] if cluster_tetragon_enabled | bool else []) }}"
# ports of jobs that are published on the host (host network, or bridge network through nat) but only for the cluster; the nat case does not
# pass the input chain; the forward chain drops all of it for everything that does not come from the cluster or the container bridges
cluster_firewall_cluster_only_ports: "{{ [cluster_traefik_metrics_port] if (cluster_traefik_metrics | bool and inventory_hostname in groups['cluster_ingress'] | default([])) else [] }}"
cluster_firewall_udp_ports: [4648, 8301]
cluster_firewall_public_tcp_ports: "{{ [80, 443] if inventory_hostname in groups['cluster_ingress'] | default([]) else [] }}"

# What containers may reach on the host itself (input chain): dns of the local resolver, and the Nomad and Consul apis on the node's cluster
# address (jobs and traefik behind wireguard talk to them; both still need tokens and tls). Consul connect needs nothing here (nomad gives
# the sidecar a unix socket to the agent, mesh traffic is nat'ed and passes the forward chain). Ports of your own host services that jobs
# need: add them here.
# Where containers WITHOUT internet access may connect to: the cluster and the container networks (the network "egress" is not restricted)
cluster_firewall_container_destinations: "{{ cluster_firewall_cluster_sources + [cluster_docker_bridge_subnet, cluster_nomad_bridge_subnet, cluster_egress_bridge_subnet] }}"
cluster_firewall_bridge_tcp_ports: "{{ [53, cluster_nomad_http_port, cluster_consul_https_port] }}"
cluster_firewall_bridge_udp_ports: [53]
