---
cluster_jobs_local_dir: "{{ cluster_base_dir }}/jobs"
cluster_jobs_remote_dir: /etc/cluster/jobs
# Jobs are run with the deployer token (tofu-nomad: run jobs, no acl, no authelia / traefik secrets), not the management token, which only
# bootstraps the acl system and serves tofu-nomad, backup and restore.
cluster_jobs_token: "{{ cluster_nomad_out.nomad_tokens.deployer }}"
cluster_jobs_env:
  NOMAD_ADDR: "https://127.0.0.1:{{ cluster_nomad_http_port }}"
  NOMAD_CACERT: "{{ cluster_tls_dir }}/ca.pem"
  NOMAD_TOKEN: "{{ cluster_jobs_token }}"

# ACME resolver name used inside traefik; '' = ingress cert from the cluster CA
cluster_jobs_tls_resolver: "{{ '' if cluster_acme_ca == 'internal' else 'le' }}"

# the jobs of this cluster (step-ca only when it is enabled)
cluster_jobs_active: >-
  {{ cluster_jobs_list
     | rejectattr('name', 'in', ([] if cluster_stepca_enabled | bool else ['step-ca']) + ([] if cluster_monitoring_enabled | bool else ['ntfy', 'monitoring-server', 'monitoring-agent']))
     | list }}

cluster_jobs_common_vars:
  datacenter: "{{ cluster_datacenter }}"
  domain: "{{ cluster_domain }}"
  tls_resolver: "{{ cluster_jobs_tls_resolver }}"

# job file -> extra -var values. Order matters: authelia first (traefik's protected routes use its forward-auth service).
cluster_jobs_list:
  - name: authelia
    vars:
      image: "{{ cluster_authelia_image }}"
      user: "{{ cluster_authelia_uid | string if cluster_authelia_uid | int != 0 else '' }}"
      tls_fingerprint: "{{ cluster_jobs_fingerprints.results | selectattr('item.job', 'eq', 'authelia') | map(attribute='stdout') | sort | join(',') | hash('sha256') }}"
  - name: authelia-internal
    file: authelia
    vars:
      image: "{{ cluster_authelia_image }}"
      user: "{{ cluster_authelia_uid | string if cluster_authelia_uid | int != 0 else '' }}"
      name: authelia-internal
      port: "{{ cluster_authelia_internal_port }}"
      data_volume: authelia-internal
      tls_volume: authelia-internal-tls
      tls_fingerprint: "{{ cluster_jobs_fingerprints.results | selectattr('item.job', 'eq', 'authelia-internal') | map(attribute='stdout') | sort | join(',') | hash('sha256') }}"
  # step-ca before traefik: traefik's ACME client (resolver stepca) asks it for the certificates of the internal names when it starts
  - name: step-ca
    vars:
      image: "{{ cluster_stepca_image }}"
      dnsmasq_image: "{{ cluster_dnsmasq_image }}"
      zone: "{{ cluster_internal_zone }}"
      ingress_addr: "{{ hostvars[groups['cluster_ingress'][0]].cluster_ip }}"
      user: "{{ cluster_stepca_uid | string }}"
  - name: traefik
    templates: true
    vars:
      templates_dir: "{{ cluster_jobs_remote_dir }}/traefik"
      image: "{{ cluster_traefik_image }}"
      user: "{{ cluster_traefik_uid | string if cluster_traefik_uid | int != 0 else '' }}"
      tls_fingerprint: "{{ cluster_jobs_fingerprints.results | selectattr('item.job', 'eq', 'traefik') | map(attribute='stdout') | sort | join(',') | hash('sha256') }}"
      consul_port: "{{ cluster_consul_https_port }}"
      nomad_port: "{{ cluster_nomad_http_port }}"
      authelia_addr: "{{ hostvars[cluster_authelia_hosts[0]].cluster_ip }}:9091"
      authelia_internal_addr: "{{ hostvars[cluster_authelia_hosts[0]].cluster_ip }}:{{ cluster_authelia_internal_port }}"
      internal_zone: "{{ cluster_internal_zone }}"
      vpn_host: "{{ cluster_vpn_host }}"
      vpn_server_ip: "{{ cluster_vpn_server_ip }}"
      vpn_subnet_prefix: "{{ cluster_vpn_subnet.split('/')[1] }}"
      vpn_wg_port: "{{ cluster_vpn_wg_port }}"
      vpn_wstunnel_port: "{{ cluster_vpn_wstunnel_port }}"
      vpn_entrypoint_port: "{{ cluster_vpn_entrypoint_port }}"
      vpn_wstunnel_user: "{{ cluster_vpn_uid | string }}"
      vpn_admin_net: "{{ cluster_vpn_admin_net }}"
      vpn_project_net: "{{ cluster_vpn_project_net }}"
      wstunnel_image: "{{ cluster_wstunnel_image }}"
      dnsmasq_image: "{{ cluster_dnsmasq_image }}"
      stepca_acme_url: "{{ cluster_stepca_acme_url if cluster_stepca_enabled | bool else '' }}"
      stepca_image: "{{ cluster_stepca_image }}"
      stepca_cert_hours: "{{ cluster_stepca_cert_hours }}"
      wireguard: "{{ cluster_traefik_wireguard | bool | to_json }}"
      wireguard_image: "{{ cluster_wireguard_image }}"
      wireguard_bypass: "{{ cluster_wireguard_bypass }}"
      metrics_port: "{{ cluster_traefik_metrics_port if cluster_traefik_metrics | bool else 0 }}"
      grafana_addr: "{{ hostvars[cluster_monitoring_node].cluster_ip ~ ':' ~ cluster_monitoring_grafana_port if cluster_monitoring_enabled | bool else '' }}"
      gatus_addr: "{{ hostvars[cluster_monitoring_node].cluster_ip ~ ':' ~ cluster_monitoring_gatus_port if cluster_monitoring_enabled | bool else '' }}"
      acme_server: "{{ cluster_acme_server }}"
      acme_email: "{{ cluster_acme_email }}"
  # the monitoring stack (cluster_monitoring_enabled): ntfy first (alerts go there), the server (Loki / Prometheus), then the agents that write to it
  - name: ntfy
    vars:
      image: "{{ cluster_monitoring_ntfy_image }}"
      port: "{{ cluster_monitoring_ntfy_port }}"
      topic: "{{ cluster_monitoring_ntfy_topic }}"
  - name: monitoring-server
    vars:
      zone: "{{ cluster_internal_zone }}"
      cluster_domain: "{{ cluster_domain }}"
      cluster_name: "{{ cluster_monitoring_title }}"
      retention_days: "{{ cluster_monitoring_retention_days }}"
      postgres_image: "{{ cluster_monitoring_postgres_image }}"
      loki_image: "{{ cluster_monitoring_loki_image }}"
      prometheus_image: "{{ cluster_monitoring_prometheus_image }}"
      alertmanager_image: "{{ cluster_monitoring_alertmanager_image }}"
      grafana_image: "{{ cluster_monitoring_grafana_image }}"
      gatus_image: "{{ cluster_monitoring_gatus_image }}"
      grafana_port: "{{ cluster_monitoring_grafana_port }}"
      gatus_port: "{{ cluster_monitoring_gatus_port }}"
      ingress_addr: "{{ hostvars[groups['cluster_ingress'][0]].cluster_ip }}"
      authelia_internal_addr: "{{ hostvars[cluster_authelia_hosts[0]].cluster_ip }}:{{ cluster_authelia_internal_port }}"
      ntfy_addr: "{{ hostvars[cluster_monitoring_node].cluster_ip }}:{{ cluster_monitoring_ntfy_port }}"
      ntfy_topic: "{{ cluster_monitoring_ntfy_topic }}"
      oidc: "{{ cluster_monitoring_oidc_enabled | bool }}"
      extra_rules: "{{ ({'groups': cluster_monitoring_extra_rules} | to_json) if cluster_monitoring_extra_rules else '' }}"
  - name: monitoring-agent
    templates: true
    vars:
      templates_dir: "{{ cluster_jobs_remote_dir }}/monitoring-agent"
      image: "{{ cluster_monitoring_vector_image }}"
      nomad_port: "{{ cluster_nomad_http_port }}"
      consul_port: "{{ cluster_consul_https_port }}"
      tetragon_port: "{{ cluster_tetragon_metrics_port if cluster_tetragon_enabled | bool else 0 }}"
      tetragon_log: "{{ cluster_tetragon_enabled | bool }}"

# authelia login regulation (per username): this many failures within find_time ban the user for ban_time
authelia_regulation_max_retries: 5
authelia_regulation_find_time: 5m
authelia_regulation_ban_time: 5m

# The two authelia instances (tofu-nomad writes the Nomad variable nomad/jobs/<name> of each, the template authelia-configuration.yml.j2 renders
# the config from authelia_inst). The public one protects public apps on cluster_domain, the internal one the zone behind the VPN. Same users and
# password hashes; own secrets, database, TOTP seeds, cookie, bans.
cluster_jobs_authelia_instances:
  - name: authelia
    port: 9091
    domain: "{{ cluster_domain }}"
    issuer: "{{ authelia_totp_issuer }}"
    rules: "{{ authelia_platform_public_rules + authelia_access_rules }}"
    session_secret: "{{ cluster_authelia_session_secret }}"
    storage_key: "{{ cluster_authelia_storage_encryption_key }}"
    jwt_secret: "{{ cluster_authelia_reset_password_jwt_secret }}"
    totp_seeds: "{{ authelia_totp_seeds | default({}) }}"
    var_prefix: authelia
  - name: authelia-internal
    port: "{{ cluster_authelia_internal_port }}"
    domain: "{{ cluster_internal_zone }}"
    issuer: "{{ authelia_totp_issuer_internal }}"
    rules: "{{ authelia_internal_access_rules }}"
    session_secret: "{{ cluster_authelia_internal_session_secret }}"
    storage_key: "{{ cluster_authelia_internal_storage_encryption_key }}"
    jwt_secret: "{{ cluster_authelia_internal_reset_password_jwt_secret }}"
    totp_seeds: "{{ authelia_internal_totp_seeds | default({}) }}"
    var_prefix: authelia_internal
    # the OpenID Connect provider (off by default, see cluster_monitoring_oidc_enabled): Grafana logs in with the accounts of authelia-internal (clients: id, secret hash, redirect uri)
    oidc: "{{ {'hmac_secret': cluster_authelia_internal_oidc_hmac_secret,
               'jwks_key': cluster_authelia_internal_oidc_jwks_key,
               'clients': [{'id': 'grafana', 'name': 'Grafana', 'secret_hash': cluster_monitoring_oidc_client_secret_hash,
                            'redirect_uris': ['https://grafana.' ~ cluster_internal_zone ~ '/login/generic_oauth']}]} if cluster_monitoring_enabled | bool and cluster_monitoring_oidc_enabled | bool else {} }}"
