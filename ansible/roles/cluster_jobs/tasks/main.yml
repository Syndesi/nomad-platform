---
# The default jobs (authelia, traefik), run on the first server with plain `nomad job run -var-file`:
# the job files in jobs/ are ordinary HCL2 and can be run by hand the same way. Their variables are
# nomad variables (tofu-nomad).
# The certificates the jobs mount from the nodes (authelia's server certificate, the ingress wildcard) are made on those nodes and never
# leave them. The jobs only get their fingerprint: authelia and traefik read the files when they start, so a renewed certificate has to
# change the job to restart it.
- name: Fingerprints of the certificates the jobs mount from the nodes
  ansible.builtin.command: openssl x509 -noout -fingerprint -sha256 -in {{ item.dir }}/{{ item.name }}.pem
  delegate_to: "{{ item.host }}"
  loop: >-
    {{ (cluster_authelia_hosts | intersect(groups['cluster_clients'] | default([]))
          | map('community.general.dict_kv', 'host')
          | map('combine', {'dir': cluster_authelia_tls_dir, 'name': 'authelia', 'job': 'authelia'}) | list)
       + (cluster_authelia_hosts | intersect(groups['cluster_clients'] | default([]))
          | map('community.general.dict_kv', 'host')
          | map('combine', {'dir': cluster_authelia_internal_tls_dir, 'name': 'authelia', 'job': 'authelia-internal'}) | list)
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_ingress_tls_dir, 'name': 'ingress', 'job': 'traefik'}) | list
          if cluster_acme_ca == 'internal' else [])
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_internal_tls_dir, 'name': 'internal', 'job': 'traefik'}) | list
          if not cluster_stepca_enabled | bool else [])
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_vpn_tls_dir, 'name': 'vpn', 'job': 'traefik'}) | list
          if not cluster_stepca_enabled | bool else []) }}
  loop_control:
    label: "{{ item.name }} on {{ item.host }}"
  register: cluster_jobs_fingerprints
  changed_when: false

# an earlier version copied the ingress key into this nomad variable (Raft, snapshots, readable with the deployer token)
- name: The old nomad variable with the ingress key, still there?
  ansible.builtin.command: nomad var get -out json nomad/jobs/traefik/traefik
  environment: "{{ cluster_jobs_env }}"
  register: cluster_jobs_old_var
  failed_when: false
  changed_when: false
  no_log: true

- name: The old nomad variable with the ingress key is purged
  ansible.builtin.command: nomad var purge nomad/jobs/traefik/traefik
  environment: "{{ cluster_jobs_env }}"
  when: cluster_jobs_old_var.rc == 0
  changed_when: true

# the wg-quick config (private key inside) from the sops secret; only the wireguard task of the job can read this path
- name: Wireguard config as nomad variable (task wireguard:conf)
  ansible.builtin.include_tasks: variable.yml
  vars:
    cluster_jobs_var_path: nomad/jobs/traefik/traefik/wireguard
    cluster_jobs_var_items:
      conf: "{{ cluster_traefik_wireguard_conf }}"
  when: cluster_traefik_wireguard | bool

- name: Job directory on the server
  ansible.builtin.file:
    path: "{{ cluster_jobs_remote_dir }}"
    state: directory
    mode: "0700"

- name: Job files on the server
  ansible.builtin.copy:
    src: "{{ cluster_jobs_local_dir }}/{{ item.file | default(item.name) }}.nomad.hcl"
    dest: "{{ cluster_jobs_remote_dir }}/{{ item.file | default(item.name) }}.nomad.hcl"
    mode: "0644"
  loop: "{{ cluster_jobs_active }}"
  loop_control:
    label: "{{ item.name }}"

# text templates a job file reads with templatefile() (jobs/<name>/*.tpl), next to the job files
- name: Template directories of the jobs on the server
  ansible.builtin.copy:
    src: "{{ cluster_jobs_local_dir }}/{{ item.name }}/"
    dest: "{{ cluster_jobs_remote_dir }}/{{ item.name }}/"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ cluster_jobs_active | selectattr('templates', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Run the jobs
  ansible.builtin.include_tasks: job.yml
  loop: "{{ cluster_jobs_active }}"
  loop_control:
    loop_var: cluster_jobs_item
    label: "{{ cluster_jobs_item.name }}"

# Authelia's databases from the backup (task restore): authelia-db is up and has made the empty databases (and authelia has migrated its schema); the dump drops
# and recreates the tables (pg_dump --clean). Then both authelias restart and read it. A backup without it is not an error: the second factors are registered
# again from the seeds, only the device list and the bans are lost.
- name: Authelia's databases from the backup (task restore)
  when: cluster_restore_dir | length > 0
  block:
    - name: The backup has them
      ansible.builtin.stat:
        path: "{{ cluster_restore_dir }}/authelia-db-{{ item }}.sql.age"
      delegate_to: localhost
      become: false
      loop: [authelia, authelia-internal]
      register: cluster_jobs_authelia_dumps

    - name: Replay them
      when: cluster_jobs_authelia_dumps.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Postgres of authelia-db is running
          ansible.builtin.shell: >-
            docker ps -q --filter label=com.hashicorp.nomad.job_name=authelia-db --filter label=com.hashicorp.nomad.task_name=postgres | head -1
          register: cluster_jobs_authelia_pg
          until: cluster_jobs_authelia_pg.stdout | length > 0
          retries: 30
          delay: 5
          changed_when: false
          delegate_to: "{{ cluster_authelia_hosts[0] }}"
          become: true

        - name: Replay one dump per instance
          ansible.builtin.include_tasks: authelia-db-restore.yml
          loop: "{{ cluster_jobs_authelia_dumps.results | selectattr('stat.exists') | map(attribute='item') | list }}"
          loop_control:
            loop_var: cluster_jobs_authelia_inst
            label: "{{ cluster_jobs_authelia_inst }}"

        - name: Both authelias read it
          ansible.builtin.command: "nomad job restart -yes {{ item }}"
          environment: "{{ cluster_jobs_env }}"
          loop: [authelia, authelia-internal]
          changed_when: true

# Grafana's database from the backup (task restore): the stack is up and has made empty tables; the dump drops and recreates them (pg_dump --clean).
# A backup without it is not an error: the dashboards are gone, everything else is as before.
- name: Grafana's database from the backup (task restore)
  when: cluster_restore_dir | length > 0 and cluster_monitoring_enabled | bool
  block:
    - name: The backup has it
      ansible.builtin.stat:
        path: "{{ cluster_restore_dir }}/grafana-db.sql.age"
      delegate_to: localhost
      become: false
      register: cluster_jobs_grafana_dump

    - name: Replay it
      when: cluster_jobs_grafana_dump.stat.exists
      block:
        - name: Decrypt on the controller (tmpfs)
          ansible.builtin.shell: >-
            set -o pipefail; umask 077;
            age -d -i {{ cluster_restore_age_key | quote }} {{ (cluster_restore_dir ~ '/grafana-db.sql.age') | quote }}
            > {{ (cluster_run_dir ~ '/restore-grafana-db.sql') | quote }}
          args:
            executable: /bin/bash
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Copy to the monitoring node
          ansible.builtin.copy:
            src: "{{ cluster_run_dir }}/restore-grafana-db.sql"
            dest: /root/restore-grafana-db.sql
            mode: "0600"
          delegate_to: "{{ cluster_monitoring_node }}"
          become: true

        - name: Postgres of the stack is running
          ansible.builtin.shell: >-
            docker ps -q --filter label=com.hashicorp.nomad.job_name=monitoring-server --filter label=com.hashicorp.nomad.task_name=postgres | head -1
          register: cluster_jobs_pg
          until: cluster_jobs_pg.stdout | length > 0
          retries: 30
          delay: 5
          changed_when: false
          delegate_to: "{{ cluster_monitoring_node }}"
          become: true

        - name: Replay the dump, then Grafana reads it
          ansible.builtin.shell: |
            set -e
            docker exec -i {{ cluster_jobs_pg.stdout }} psql -v ON_ERROR_STOP=0 -q -U grafana grafana < /root/restore-grafana-db.sql >/dev/null
            g=$(docker ps -q --filter label=com.hashicorp.nomad.job_name=monitoring-server --filter label=com.hashicorp.nomad.task_name=grafana | head -1)
            [ -z "$g" ] || docker restart "$g" >/dev/null
          changed_when: true
          delegate_to: "{{ cluster_monitoring_node }}"
          become: true

      always:
        - name: The decrypted dump is removed (controller and node)
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          delegate_to: "{{ item.host }}"
          become: "{{ item.host != 'localhost' }}"
          loop:
            - { host: localhost, path: "{{ cluster_run_dir }}/restore-grafana-db.sql" }
            - { host: "{{ cluster_monitoring_node }}", path: /root/restore-grafana-db.sql }
