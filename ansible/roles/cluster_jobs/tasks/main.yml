---
# The default jobs (authelia, traefik), run on the first server with plain `nomad job run -var-file`:
# the job files in jobs/ are ordinary HCL2 and can be run by hand the same way. Their variables are
# nomad variables (tofu-nomad).
# The certificates the jobs mount from the nodes (authelia's server certificate, the ingress wildcard) are made on those nodes and never
# leave them. The jobs only get their fingerprint: authelia and traefik read the files when they start, so a renewed certificate has to
# change the job to restart it.
- name: Fingerprints of the certificates the jobs mount from the nodes
  ansible.builtin.command: openssl x509 -noout -fingerprint -sha256 -in {{ item.dir }}/{{ item.name }}.pem
  delegate_to: "{{ item.host }}"
  loop: >-
    {{ (cluster_authelia_hosts | intersect(groups['cluster_clients'] | default([]))
          | map('community.general.dict_kv', 'host')
          | map('combine', {'dir': cluster_authelia_tls_dir, 'name': 'authelia', 'job': 'authelia'}) | list)
       + (cluster_authelia_hosts | intersect(groups['cluster_clients'] | default([]))
          | map('community.general.dict_kv', 'host')
          | map('combine', {'dir': cluster_authelia_internal_tls_dir, 'name': 'authelia', 'job': 'authelia-internal'}) | list)
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_ingress_tls_dir, 'name': 'ingress', 'job': 'traefik'}) | list
          if cluster_acme_ca == 'internal' else [])
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_internal_tls_dir, 'name': 'internal', 'job': 'traefik'}) | list
          if not cluster_stepca_enabled | bool else [])
       + ((groups['cluster_ingress'] | default([]))
          | map('community.general.dict_kv', 'host') | map('combine', {'dir': cluster_vpn_tls_dir, 'name': 'vpn', 'job': 'traefik'}) | list
          if not cluster_stepca_enabled | bool else []) }}
  loop_control:
    label: "{{ item.name }} on {{ item.host }}"
  register: cluster_jobs_fingerprints
  changed_when: false

# an earlier version copied the ingress key into this nomad variable (Raft, snapshots, readable with the deployer token)
- name: The old nomad variable with the ingress key, still there?
  ansible.builtin.command: nomad var get -out json nomad/jobs/traefik/traefik
  environment: "{{ cluster_jobs_env }}"
  register: cluster_jobs_old_var
  failed_when: false
  changed_when: false
  no_log: true

- name: The old nomad variable with the ingress key is purged
  ansible.builtin.command: nomad var purge nomad/jobs/traefik/traefik
  environment: "{{ cluster_jobs_env }}"
  when: cluster_jobs_old_var.rc == 0
  changed_when: true

# the wg-quick config (private key inside) from the sops secret; only the wireguard task of the job can read this path
- name: Wireguard config as nomad variable (task wireguard:conf)
  ansible.builtin.include_tasks: variable.yml
  vars:
    cluster_jobs_var_path: nomad/jobs/traefik/traefik/wireguard
    cluster_jobs_var_items:
      conf: "{{ cluster_traefik_wireguard_conf }}"
  when: cluster_traefik_wireguard | bool

- name: Job directory on the server
  ansible.builtin.file:
    path: "{{ cluster_jobs_remote_dir }}"
    state: directory
    mode: "0700"

- name: Job files on the server
  ansible.builtin.copy:
    src: "{{ cluster_jobs_local_dir }}/{{ item.file | default(item.name) }}.nomad.hcl"
    dest: "{{ cluster_jobs_remote_dir }}/{{ item.file | default(item.name) }}.nomad.hcl"
    mode: "0644"
  loop: "{{ cluster_jobs_active }}"
  loop_control:
    label: "{{ item.name }}"

# text templates a job file reads with templatefile() (jobs/<name>/*.tpl), next to the job files
- name: Template directories of the jobs on the server
  ansible.builtin.copy:
    src: "{{ cluster_jobs_local_dir }}/{{ item.name }}/"
    dest: "{{ cluster_jobs_remote_dir }}/{{ item.name }}/"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ cluster_jobs_active | selectattr('templates', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Run the jobs
  ansible.builtin.include_tasks: job.yml
  loop: "{{ cluster_jobs_active }}"
  loop_control:
    loop_var: cluster_jobs_item
    label: "{{ cluster_jobs_item.name }}"
