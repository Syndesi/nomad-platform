---
# true = always issue a new key + cert (maintenance does this); false = only when missing, expiring
# within cluster_leaf_renew_before_days, or when the SAN list changed.
cluster_pki_force: false
cluster_pki_extra_sans: []

# The names every key may carry. Each daemon has its OWN key and certificate with only its own names: the consul agent runs as an
# unprivileged user and holds consul.key, so it cannot pose as a nomad server (and nomad's key is not readable by it).
cluster_tls_base_dns_sans: "{{ [cluster_node_fqdn, 'localhost'] + cluster_host_names + cluster_pki_extra_sans }}"
cluster_tls_consul_dns_sans: >-
  {{ cluster_tls_base_dns_sans
     + (['server.' ~ cluster_datacenter ~ '.consul'] if inventory_hostname in groups['cluster_servers'] | default([]) else []) }}
cluster_tls_node_dns_sans: >-
  {{ [cluster_node_fqdn, 'localhost']
     + ((['server.' ~ cluster_region ~ '.nomad'])
        if inventory_hostname in groups['cluster_servers'] | default([]) else [])
     + ((['client.' ~ cluster_region ~ '.nomad'])
        if inventory_hostname in groups['cluster_clients'] | default([]) else [])
     + cluster_host_names
     + cluster_pki_extra_sans }}

# subjectAltName value of the node cert: names + 127.0.0.1 (the tofu tunnel and local clients connect there) + the cluster address
# The grpc listener of consul (the envoy sidecars of consul connect verify it) has a certificate of its own WITHOUT ip addresses: envoy's TLS library
# (BoringSSL) rejects any chain that has an ip address in the leaf and ip name constraints in the CA, which ours has (tested with envoy 1.39).
cluster_tls_consul_grpc_sans: "{{ cluster_tls_consul_dns_sans | unique | map('regex_replace', '^', 'DNS:') | list | join(',') }}"
cluster_tls_consul_sans: "{{ (cluster_tls_consul_dns_sans | unique | map('regex_replace', '^', 'DNS:') | list + ['IP:127.0.0.1', 'IP:' ~ cluster_ip]) | join(',') }}"
cluster_tls_node_sans: "{{ (cluster_tls_node_dns_sans | map('regex_replace', '^', 'DNS:') | list + ['IP:127.0.0.1', 'IP:' ~ cluster_ip]) | join(',') }}"

# Wildcard cert for the ingress (traefik, internal CA mode). Its key lives on the ingress node(s).
cluster_tls_ingress: "{{ cluster_acme_ca == 'internal' and inventory_hostname in groups['cluster_ingress'] | default([]) }}"
cluster_tls_authelia: "{{ inventory_hostname in cluster_authelia_hosts and inventory_hostname in groups['cluster_clients'] | default([]) }}"
# traefik calls authelia at https://<cluster address>:9091
cluster_tls_authelia_sans: "DNS:{{ cluster_node_fqdn }},DNS:authelia.service.consul,DNS:auth.{{ cluster_domain }},IP:127.0.0.1,IP:{{ cluster_ip }}"
# the second authelia (same node, same names plus its own service name) and the VPN: wstunnel's server certificate, and the wildcard of the internal zone
# (ingress nodes only; traefik serves it on the entry point "vpn")
# + auth.<zone>: the apps that log in with it (OpenID Connect, docs/reference.md) call it by that name through their mesh sidecar and verify the certificate
cluster_tls_authelia_internal_sans: "DNS:{{ cluster_node_fqdn }},DNS:authelia-internal.service.consul,DNS:auth.{{ cluster_internal_zone }},IP:127.0.0.1,IP:{{ cluster_ip }}"
cluster_tls_vpn: "{{ inventory_hostname in groups['cluster_ingress'] | default([]) }}"
cluster_tls_vpn_sans: "DNS:{{ cluster_vpn_host }}"
cluster_tls_internal_sans: "DNS:*.{{ cluster_internal_zone }},DNS:{{ cluster_internal_zone }}"
cluster_tls_ingress_sans: "DNS:*.{{ cluster_domain }},DNS:{{ cluster_domain }}"
