---
# One certificate by CSR.
# Input: cluster_tls_name (file base name), cluster_tls_cn, cluster_tls_sans (subjectAltName value),
#        cluster_tls_eku, optional cluster_tls_bootstrap_only (a certificate that step-ca takes over: made only while there is none). Files: <tls dir>/<name>.key|.pem and <name>.sans (what the cert was issued for).
- name: "{{ cluster_tls_name }}: is the cert still good?"
  ansible.builtin.shell: |
    d={{ cluster_tls_dir }}; n={{ cluster_tls_name }}
    [ -s "$d/$n.key" ] && [ -s "$d/$n.pem" ] || { echo missing; exit 0; }
    {% if cluster_tls_bootstrap_only | default(false) | bool %}
    echo ok; exit 0
    {% endif %}
    [ "$(cat "$d/$n.sans" 2>/dev/null)" = {{ cluster_tls_sans | quote }} ] || { echo sans-changed; exit 0; }
    # the last certificate of the file is the intermediate that signed it: a new intermediate (or a new PKI) renews everything
    [ "$(awk '/BEGIN CERTIFICATE/{c=""} {c=c $0 "\n"} END{printf "%s", c}' "$d/$n.pem" | sha256sum | cut -d' ' -f1)" = {{ ((lookup('ansible.builtin.file', cluster_intermediate_cert) | trim) ~ '\n') | hash('sha256') | quote }} ] || { echo issuer-changed; exit 0; }
    openssl x509 -in "$d/$n.pem" -noout -checkend {{ cluster_leaf_renew_before_days * 86400 }} >/dev/null || { echo expiring; exit 0; }
    echo ok
  register: cluster_tls_state
  changed_when: false

- name: "{{ cluster_tls_name }}: new key, CSR, signature"
  when: cluster_pki_force | bool or cluster_tls_state.stdout != 'ok'
  block:
    - name: "{{ cluster_tls_name }}: key and CSR on the node"
      ansible.builtin.shell: |
        umask 077
        d={{ cluster_tls_dir }}; n={{ cluster_tls_name }}
        openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -keyout "$d/$n.key.new" -out "$d/$n.csr" \
          -subj {{ ('/O=' ~ cluster_name ~ ' cluster/CN=' ~ cluster_tls_cn) | quote }} \
          -addext {{ ('subjectAltName=' ~ cluster_tls_sans) | quote }} \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage={{ cluster_tls_eku }}"
        cat "$d/$n.csr"
      register: cluster_tls_csr
      changed_when: true

    # The node is not trusted: the CSR comes from a machine that may be compromised, and the signing copies its extensions (names, key usage,
    # basic constraints) into the certificate. So the controller signs only what it would have asked for itself: exactly the names and
    # usages of this node's role (cluster_tls_sans / cluster_tls_eku), the subject, an EC key, no other extension (no CA:TRUE, no name constraints).
    - name: "{{ cluster_tls_name }}: read the CSR (on the controller)"
      community.crypto.openssl_csr_info:
        content: "{{ cluster_tls_csr.stdout }}"
      delegate_to: localhost
      become: false
      register: cluster_tls_csr_info

    - name: "{{ cluster_tls_name }}: the CSR asks for nothing but what this node gets"
      ansible.builtin.assert:
        that:
          - cluster_tls_csr_info.signature_valid
          - cluster_tls_csr_info.public_key_type == 'ECC'
          - (cluster_tls_csr_info.subject_alt_name | map('lower') | sort) == (cluster_tls_sans.split(',') | map('trim') | map('lower') | sort)
          - (cluster_tls_csr_info.extended_key_usage | sort) == (cluster_tls_eku.split(',') | map('extract', cluster_tls_eku_names) | sort)
          - (cluster_tls_csr_info.key_usage | default([], true) | sort) == ['Digital Signature', 'Key Encipherment']
          - cluster_tls_csr_info.basic_constraints is none
          - cluster_tls_csr_info.extensions_by_oid.keys() | difference(['2.5.29.17', '2.5.29.15', '2.5.29.37']) | length == 0
          - "cluster_tls_csr_info.subject == {'organizationName': cluster_name ~ ' cluster', 'commonName': cluster_tls_cn}"
        fail_msg: >-
          {{ inventory_hostname }} sent a CSR for '{{ cluster_tls_name }}' that is not what this node gets, NOT signed (possible compromise):
          names {{ cluster_tls_csr_info.subject_alt_name }}, eku {{ cluster_tls_csr_info.extended_key_usage }},
          key usage {{ cluster_tls_csr_info.key_usage }}, basic constraints {{ cluster_tls_csr_info.basic_constraints }},
          extensions {{ cluster_tls_csr_info.extensions_by_oid.keys() | list }}, subject {{ cluster_tls_csr_info.subject }};
          expected names {{ cluster_tls_sans }}, eku {{ cluster_tls_eku }}, CN {{ cluster_tls_cn }}.
        quiet: true
      delegate_to: localhost
      become: false
      vars:
        cluster_tls_eku_names:
          serverAuth: TLS Web Server Authentication
          clientAuth: TLS Web Client Authentication

    - name: "{{ cluster_tls_name }}: sign with the ansible intermediate (on the controller, in memory)"
      community.crypto.x509_certificate_pipe:
        csr_content: "{{ cluster_tls_csr.stdout }}"
        provider: ownca
        ownca_content: "{{ lookup('ansible.builtin.file', cluster_intermediate_cert) }}"
        ownca_privatekey_content: "{{ cluster_intermediate_key }}"
        ownca_not_after: "+{{ cluster_leaf_valid_days }}d"
        ownca_not_before: "-5m"
      delegate_to: localhost
      become: false
      register: cluster_tls_signed
      no_log: true

    - name: "{{ cluster_tls_name }}: certificate on the node"
      ansible.builtin.copy:
        # leaf + intermediate: a peer trusts the root only and builds the chain from what the server sends
        content: "{{ cluster_tls_signed.certificate | trim }}\n{{ lookup('ansible.builtin.file', cluster_intermediate_cert) | trim }}\n"
        dest: "{{ cluster_tls_dir }}/{{ cluster_tls_name }}.pem.new"
        owner: root
        group: root
        mode: "0644"

    # key and cert switch together, then the daemons are reloaded (see main.yml)
    - name: "{{ cluster_tls_name }}: put key and cert in place"
      ansible.builtin.shell: |
        d={{ cluster_tls_dir }}; n={{ cluster_tls_name }}
        chown {{ cluster_tls_key_owner | default('root') }}:{{ cluster_tls_key_owner | default('root') }} "$d/$n.key.new"
        mv "$d/$n.key.new" "$d/$n.key" && mv "$d/$n.pem.new" "$d/$n.pem"
        printf '%s' {{ cluster_tls_sans | quote }} > "$d/$n.sans"
        rm -f "$d/$n.csr"
      changed_when: true

    - name: "{{ cluster_tls_name }}: remember that it changed"
      ansible.builtin.set_fact:
        cluster_tls_node_changed: "{{ cluster_tls_node_changed | default(false) or cluster_tls_name in ['node', 'consul', 'consul-grpc'] }}"

# also right for a key that exists from before (the owner is a setting)
- name: "{{ cluster_tls_name }}: owner and mode of the key"
  ansible.builtin.file:
    path: "{{ cluster_tls_dir }}/{{ cluster_tls_name }}.key"
    owner: "{{ cluster_tls_key_owner | default('root') }}"
    group: "{{ cluster_tls_key_owner | default('root') }}"
    mode: "0600"
