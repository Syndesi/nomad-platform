---
# *.consul resolves on the node itself AND inside docker containers (nomad tasks).
#   debian: systemd-resolved forwards ~consul to the local consul dns port and also listens on docker0
#   alpine: dnsmasq forwards consul to the local dns port, everything else upstream, listens on docker0
# docker gets `dns: [docker0 ip]` on both. Pattern taken from the previous deployments.
# Containers have no internet by default (see the firewall), and neither does their dns: the address docker hands out (docker0) is answered by a
# RESTRICTED resolver (a dnsmasq: *.consul and this node's names only). The containers of the network "egress" are sent to the full resolver at
# the egress bridge's address by a firewall rule (nat). That one is the node's dnsmasq on alpine and a second dnsmasq in front of systemd-resolved on debian.
- name: Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

# live-restore: the containers keep running while dockerd is stopped or restarted (a security update of docker by unattended-upgrades / apk upgrade,
# a change of this file), nomad's docker driver finds them again. Not for a major version change of docker, and not with swarm (not used here).
# No daemon-wide `init: true`: it puts tini in front of every container, and images that bring their own init (s6-overlay: every linuxserver.io image, the
# wireguard sidecar of traefik) refuse to start when they are not pid 1. A job that wants one sets `init = true` in its docker config.
# default-cgroupns-mode: every container has its own cgroup namespace (the default on cgroup v2,
# set so that a cgroup v1 node does the same). userland-proxy: published ports are plain iptables rules, no docker-proxy process per port.
# default-ulimits: see cluster_docker_nofile.
- name: Docker daemon config (dns, logs, live-restore)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ ({'dns': [cluster_dns_docker_bridge_ip], 'log-driver': 'json-file', 'log-opts': {'max-size': cluster_docker_log_max_size, 'max-file': cluster_docker_log_max_files | string}, 'no-new-privileges': true, 'live-restore': true, 'default-cgroupns-mode': 'private', 'userland-proxy': false, 'default-ulimits': {'nofile': {'Name': 'nofile', 'Hard': cluster_docker_nofile | int, 'Soft': cluster_docker_nofile | int}}} | combine(cluster_gvisor_docker_daemon if cluster_gvisor_enabled | bool else {}, recursive=True) | combine(cluster_docker_daemon_extra, recursive=True)) | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  register: cluster_dns_docker

- name: Directory of the resolver configs
  ansible.builtin.file:
    path: /etc/cluster
    state: directory
    mode: "0755"

- name: Restricted resolver config (containers without internet access)
  ansible.builtin.template:
    src: dns-restricted.conf.j2
    dest: /etc/cluster/dns-restricted.conf
    owner: root
    group: root
    mode: "0644"
  register: cluster_dns_restricted

- name: Debian - systemd-resolved

  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    # one file (each file is a round trip to the node): the consul zone. The containers' resolvers are the two dnsmasq below.
    - name: consul drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/cluster.conf
        content: |
          [Resolve]
          DNS=127.0.0.1:{{ cluster_dns_consul_port }}
          DNSSEC=no
          Domains=~consul.
          DNSStubListener=yes
        owner: root
        group: root
        mode: "0644"
      register: cluster_dns_resolved

    - name: Restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
      when: cluster_dns_resolved.changed

    - name: Full resolver config for the network "egress"
      ansible.builtin.template:
        src: dns-egress.conf.j2
        dest: /etc/cluster/dns-egress.conf
        owner: root
        group: root
        mode: "0644"
      register: cluster_dns_egress

    - name: systemd unit of the resolvers
      ansible.builtin.template:
        src: cluster-dns@.service.j2
        dest: /etc/systemd/system/cluster-dns@.service
        owner: root
        group: root
        mode: "0644"
      register: cluster_dns_unit

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: cluster_dns_unit.changed

    # restricted: docker0's address (a restart of resolved frees it if it still listened there); egress: the egress bridge's address
    - name: The resolvers run
      ansible.builtin.systemd:
        name: "cluster-dns@{{ item.name }}"
        enabled: true
        state: "{{ 'restarted' if (item.changed or cluster_dns_unit.changed or cluster_dns_resolved.changed) else 'started' }}"
      loop:
        - { name: restricted, changed: "{{ cluster_dns_restricted.changed }}" }
        - { name: egress, changed: "{{ cluster_dns_egress.changed }}" }

- name: Alpine - dnsmasq
  when: ansible_facts['os_family'] == 'Alpine'
  block:
    - name: dnsmasq reads /etc/dnsmasq.d
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^#?conf-dir=/etc/dnsmasq.d'
        line: "conf-dir=/etc/dnsmasq.d/,*.conf"
        create: true
        mode: "0644"
      register: cluster_dns_conf_dir

    - name: dnsmasq drop-in
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/cluster.conf
        content: |
          server=/consul/127.0.0.1#{{ cluster_dns_consul_port }}
          no-resolv
          {% for u in cluster_dns_upstreams %}
          server={{ u }}
          {% endfor %}
          # the host, and the egress bridge (its address appears when nomad creates the network, after dnsmasq started). docker0 belongs to
          # the restricted resolver below.
          listen-address=127.0.0.1,{{ cluster_egress_bridge_ip }}
          bind-dynamic
        owner: root
        group: root
        mode: "0644"
      register: cluster_dns_dnsmasq

    # udhcpc must stop overwriting resolv.conf, otherwise the dhcp lease points the node past dnsmasq
    - name: udhcpc leaves resolv.conf alone
      ansible.builtin.lineinfile:
        path: /etc/udhcpc/udhcpc.conf
        regexp: '^#?\s*RESOLV_CONF='
        line: "RESOLV_CONF=no"
        create: true
        mode: "0644"

    # the alpine cloud image uses dhcpcd: it rewrites resolv.conf on every boot and lease renewal
    - name: dhcpcd leaves resolv.conf alone
      ansible.builtin.lineinfile:
        path: /etc/dhcpcd.conf
        regexp: '^#?\s*nohook\s+resolv\.conf'
        line: "nohook resolv.conf"
        create: true
        mode: "0644"
      register: cluster_dns_dhcpcd

    # dhcpcd also configures the containers' veth interfaces (it asks for leases on them and takes them over): it has no business there
    - name: dhcpcd leaves the container interfaces alone
      ansible.builtin.lineinfile:
        path: /etc/dhcpcd.conf
        regexp: '^#?\s*denyinterfaces\s'
        line: "denyinterfaces veth* docker* br-* nomad*"
        create: true
        mode: "0644"
      register: cluster_dns_dhcpcd_deny

    # A running dhcpcd only reads its config when told to, otherwise it overwrites resolv.conf at the next lease renewal. The first dhcpcd is
    # started at boot by the network stack (ifupdown), not by OpenRC: `rc-service dhcpcd restart` leaves that one running with the old
    # config and starts a second manager next to it. So: never restart, tell the running one to reload (`dhcpcd -n`, same lease, the
    # address stays) and make sure that only one manager runs (the one that owns the pid file; a leftover is stopped). Runs on every deploy.
    - name: Exactly one dhcpcd manager runs, with the current config
      ansible.builtin.shell: |
        keep=$(cat /run/dhcpcd/pid 2>/dev/null || true)
        # (no process title in this comment: pgrep -f would match this very shell) a manager started for one interface at boot by the
        # network stack is titled with the interface name, not "manager"; its proxies are not matched
        mgrs=$(pgrep -f 'dhcpcd: (\[manager\]|[A-Za-z0-9._-]+ \[ip[46]\])' || true)
        n=0
        if [ -n "$keep" ] && printf '%s\n' "$mgrs" | grep -qx "$keep"; then
          for p in $mgrs; do
            if [ "$p" != "$keep" ]; then kill "$p" && n=$((n + 1)); fi
          done
        fi
        {% if cluster_dns_dhcpcd is changed or cluster_dns_dhcpcd_deny is changed %}dhcpcd -n >/dev/null 2>&1 || true{% endif %}

        echo "stopped $n"
      register: cluster_dns_dhcpcd_single
      changed_when: "'stopped 0' not in cluster_dns_dhcpcd_single.stdout or cluster_dns_dhcpcd is changed or cluster_dns_dhcpcd_deny is changed"

    - name: resolv.conf points at the local dnsmasq
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          search {{ cluster_node_domain }}
          nameserver 127.0.0.1
        mode: "0644"

    - name: dnsmasq enabled and running
      ansible.builtin.service:
        name: dnsmasq
        enabled: true
        state: "{{ 'restarted' if (cluster_dns_dnsmasq.changed or cluster_dns_conf_dir.changed) else 'started' }}"

    - name: OpenRC service of the restricted resolver
      ansible.builtin.template:
        src: cluster-dns-restricted.openrc.j2
        dest: /etc/init.d/cluster-dns-restricted
        owner: root
        group: root
        mode: "0755"
      register: cluster_dns_openrc

    - name: The restricted resolver runs
      ansible.builtin.service:
        name: cluster-dns-restricted
        enabled: true
        state: "{{ 'restarted' if (cluster_dns_restricted.changed or cluster_dns_openrc.changed or cluster_dns_dnsmasq.changed) else 'started' }}"

# the resolvers serve /etc/hosts to the host and to containers: the same name is the local node everywhere
- name: Names of this node (cluster_host_names) in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} cluster_host_names"
    block: "{{ cluster_ip }} {{ cluster_host_names | join(' ') }}"
  register: cluster_dns_hosts

- name: The dnsmasq instances re-read /etc/hosts
  ansible.builtin.command: pkill -HUP dnsmasq
  register: cluster_dns_hup
  failed_when: cluster_dns_hup.rc not in [0, 1]
  when: cluster_dns_hosts is changed
  changed_when: true

- name: Restart docker so containers get the new resolver
  ansible.builtin.service:
    name: docker
    state: restarted
  when: cluster_dns_docker.changed
